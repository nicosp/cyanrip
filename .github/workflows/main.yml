name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - workflow
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
  
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config nasm ffmpeg libcdio-paranoia libmusicbrainz curl qrencode

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build
          ninja -C build

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson test -C build --print-errorlogs

  linux-static:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container: alpine:3.22
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          apk add bash build-base meson ninja pkgconf cmake nasm autoconf automake libtool \
            git curl xz xz-dev xz-static bzip2 tar zlib-dev zlib-static bzip2-dev bzip2-static \
            openssl-dev openssl-libs-static libxml2-dev libxml2-static linux-headers

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/static-build.sh
          cp cyanrip cyanrip-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-linux-amd64
          path: cyanrip-linux-amd64

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk add github-cli
          gh release upload "${{ github.event.release.tag_name }}" cyanrip-linux-amd64 --clobber

  macos-dmg:
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            arch: arm64
          - runs-on: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja pkg-config cmake nasm autoconf automake libtool

      - name: Build
        run: .github/static-build.sh

      - name: Create the disk image
        run: |
          mkdir dmg
          cp cyanrip README.md LICENSE.md dmg/
          codesign --force --sign - dmg/cyanrip
          hdiutil create -volname cyanrip -srcfolder dmg -ov -format UDZO \
            "cyanrip-macos-${{ matrix.arch }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-macos-${{ matrix.arch }}
          path: cyanrip-macos-${{ matrix.arch }}.dmg

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "cyanrip-macos-${{ matrix.arch }}.dmg" --clobber

  mingw:
    runs-on: windows-latest
    env:
      MSYSTEM: MINGW64
    defaults:
       run:
          shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          install: git base-devel zip autoconf automake libtool mingw-w64-x86_64-toolchain mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake mingw-w64-x86_64-nasm mingw-w64-x86_64-libcdio-paranoia mingw-w64-x86_64-opus mingw-w64-x86_64-lame mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libxml2 mingw-w64-x86_64-nghttp2
          update: true

      - name: Build
        run: |
          .github/mingw-build.sh
          zip cyanrip cyanrip.exe

      - name: "Upload artifact"
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-${{ matrix.runs-on }}
          path: cyanrip.exe

      - name: Get Release
        id: get_release
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        shell: bash
        run: |
          echo "::set-output name=upload_url_release::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/$(cut -d/ -f3 <<< ${{ github.ref }}) | jq -r ."upload_url")"
          echo "::set-output name=upload_url_nightly::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly | jq -r ."upload_url")"
          echo "::set-output name=nightly_id::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly | jq -r ."id")"

      - name: Upload a Release Asset
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release != 'null'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_release }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload versioned Nightly asset
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release == 'null' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: WebFreak001/deploy-nightly@v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_nightly }}
          release_id: ${{ steps.get_release.outputs.nightly_id }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64-$$.exe
          asset_content_type: application/vnd.microsoft.portable-executable
          max_releases: 4

      - name: Delete existing nightly latest
        id: del_nightly_release
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release == 'null' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          assets: cyanrip-win64-latest.exe
          fail-if-no-assets: false

      - name: Upload latest Nightly Asset
        if: steps.del_nightly_release.conclusion == 'success' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_nightly }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64-latest.exe
          asset_content_type: application/vnd.microsoft.portable-executable
