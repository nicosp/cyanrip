name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - workflow
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
  
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config nasm ffmpeg libcdio-paranoia libmusicbrainz curl qrencode

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build
          ninja -C build

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson test -C build --print-errorlogs

  mingw:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MSYSTEM: MINGW64
    defaults:
       run:
          shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          install: git base-devel zip autoconf automake libtool mingw-w64-x86_64-toolchain mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake mingw-w64-x86_64-nasm mingw-w64-x86_64-libcdio-paranoia mingw-w64-x86_64-opus mingw-w64-x86_64-lame mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libxml2 mingw-w64-x86_64-nghttp2
          update: true

      - name: Build
        run: |
          .github/mingw-build.sh
          zip cyanrip cyanrip.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-win64
          path: cyanrip.exe

      - name: Upload the release asset
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp cyanrip.exe cyanrip-win64.exe
          gh release upload "${{ github.event.release.tag_name }}" cyanrip-win64.exe --clobber
