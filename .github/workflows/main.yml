name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - workflow
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev \
            libchromaprint-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      # UBSan only prints by default, and the rip tests keep cyanrip's
      # output only when it fails
      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson setup build-san -Db_sanitize=address,undefined -Db_lundef=false
          ninja -C build-san
          meson test -C build-san --print-errorlogs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config nasm ffmpeg libcdio-paranoia libmusicbrainz curl qrencode chromaprint

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build
          ninja -C build

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson test -C build --print-errorlogs

  linux-static:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container: alpine:3.22
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: |
          apk add bash build-base meson ninja pkgconf cmake nasm autoconf automake libtool \
            git curl xz xz-dev xz-static bzip2 tar zlib-dev zlib-static bzip2-dev bzip2-static \
            openssl-dev openssl-libs-static libxml2-dev libxml2-static linux-headers

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .github/static-build.sh
          cp cyanrip cyanrip-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-linux-amd64
          path: cyanrip-linux-amd64

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk add github-cli
          gh release upload "${{ github.event.release.tag_name }}" cyanrip-linux-amd64 --clobber

  macos-dmg:
    if: github.event_name == 'release'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja pkg-config cmake nasm autoconf automake libtool

      - name: Build
        run: .github/static-build.sh

      - name: Create the disk image
        run: |
          mkdir dmg
          cp cyanrip README.md LICENSE.md dmg/
          codesign --force --sign - dmg/cyanrip
          hdiutil create -volname cyanrip -srcfolder dmg -ov -format UDZO \
            cyanrip-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-macos-arm64
          path: cyanrip-macos-arm64.dmg

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" cyanrip-macos-arm64.dmg --clobber

  mingw:
    runs-on: windows-latest
    env:
      MSYSTEM: MINGW64
    defaults:
       run:
          shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          install: git base-devel zip autoconf automake libtool mingw-w64-x86_64-toolchain mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake mingw-w64-x86_64-nasm mingw-w64-x86_64-libcdio-paranoia mingw-w64-x86_64-opus mingw-w64-x86_64-lame mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libxml2 mingw-w64-x86_64-nghttp2
          update: true

      - name: Build
        run: |
          .github/mingw-build.sh
          zip cyanrip cyanrip.exe

      - name: "Upload artifact"
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cyanrip-${{ matrix.runs-on }}
          path: cyanrip.exe

      - name: Get Release
        id: get_release
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        shell: bash
        run: |
          echo "::set-output name=upload_url_release::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/$(cut -d/ -f3 <<< ${{ github.ref }}) | jq -r ."upload_url")"
          echo "::set-output name=upload_url_nightly::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly | jq -r ."upload_url")"
          echo "::set-output name=nightly_id::$(curl -sL https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly | jq -r ."id")"

      - name: Upload a Release Asset
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release != 'null'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_release }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload versioned Nightly asset
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release == 'null' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: WebFreak001/deploy-nightly@v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_nightly }}
          release_id: ${{ steps.get_release.outputs.nightly_id }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64-$$.exe
          asset_content_type: application/vnd.microsoft.portable-executable
          max_releases: 4

      - name: Delete existing nightly latest
        id: del_nightly_release
        if: steps.get_release.conclusion == 'success' && steps.get_release.outputs.upload_url_release == 'null' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          assets: cyanrip-win64-latest.exe
          fail-if-no-assets: false

      - name: Upload latest Nightly Asset
        if: steps.del_nightly_release.conclusion == 'success' && steps.get_release.outputs.upload_url_nightly != 'null'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url_nightly }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64-latest.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  msvc:
    runs-on: windows-latest
    env:
      DEPS: ${{ github.workspace }}/deps
      VCPKG_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # pkgconf from PyPI, as the runner's pkg-config is Strawberry Perl's
      - name: Install Meson
        run: |
          pip install meson ninja pkgconf
          "PKG_CONFIG=pkgconf" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Get the vcpkg version
        id: vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-msvc-${{ steps.vcpkg.outputs.commit }}-ffmpeg-zlib-curl-libxml2-pthreads

      - name: Install dependencies from vcpkg
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install --triplet $env:VCPKG_TRIPLET `
            "ffmpeg[core,avcodec,avformat,avfilter,swresample,zlib,ffprobe]" curl libxml2 pthreads
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET"
          "VCPKG_PREFIX=$vcpkg" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:DEPS/lib/pkgconfig;$vcpkg/lib/pkgconfig" >> $env:GITHUB_ENV
          "INCLUDE=$vcpkg\include;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$vcpkg\lib;$env:LIB" >> $env:GITHUB_ENV
          "$env:DEPS\bin" >> $env:GITHUB_PATH
          "$vcpkg\bin" >> $env:GITHUB_PATH
          "$vcpkg\tools\ffmpeg" >> $env:GITHUB_PATH

      # Saved straight away, so a later step failing doesn't lose it
      - uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-msvc-${{ steps.vcpkg.outputs.commit }}-ffmpeg-zlib-curl-libxml2-pthreads

      - name: Build libcdio
        run: |
          git clone --depth 1 -b export-macros https://github.com/nicosp/libcdio-C.git
          meson setup libcdio-C/build libcdio-C --prefix $env:DEPS --buildtype release `
            -Dcxx=false -Dexamples=false -Dtests=false -Dcddb=disabled
          if ($LASTEXITCODE -ne 0) { exit 1 }
          meson install -C libcdio-C/build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build libcdio-paranoia
        run: |
          git clone --depth 1 -b meson-export-symbols https://github.com/nicosp/libcdio-paranoia.git
          meson setup libcdio-paranoia/build libcdio-paranoia --prefix $env:DEPS --buildtype release `
            --wrap-mode nofallback -Dexamples=false -Dtests=false
          if ($LASTEXITCODE -ne 0) { exit 1 }
          meson install -C libcdio-paranoia/build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build libmusicbrainz
        run: |
          git clone --depth 1 -b msvc-fixes https://github.com/nicosp/libmusicbrainz.git
          $prefix = $env:DEPS -replace '\\', '/'
          cmake -S libmusicbrainz -B libmusicbrainz/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build libmusicbrainz/build --target musicbrainz5 musicbrainz5cc
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --install libmusicbrainz/build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        run: |
          meson setup build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Keep going after errors so one run reports all of them
          meson compile -C build --ninja-args=-k0
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test
        run: meson test -C build --print-errorlogs
